<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#159b73"><link rel="stylesheet" href="style.css"><title>بوابة الطالب | بشراكم</title></head><body>
<header><div class="brand"><img class="logo-img" src="boshra-logo.jpg"><div><h1>بوابة الطالب</h1><p>المقرر والتقييم</p></div></div><a class="profile" href="index.html">الرئيسية</a></header>
<main><section class="hero"><div><small>الطالب</small><h2>متابعتي القرآنية</h2><p>اختر اسم الطالب لعرض المقرر وسجل الحفظ والتقييم فقط.</p></div><div class="hero-mark">👨‍🎓</div></section>
<section id="studentGate" class="panel"><div class="panel-head"><div><h2>دخول الطالب</h2><p>اختر اسم الطالب</p></div></div>
<div class="form-card"><label>الطالب</label><select id="studentSelect"><option value="">اختر الطالب</option></select><button class="primary" onclick="studentLogin()">دخول</button></div></section>
<section id="panel" class="panel hidden"></section></main><footer>جمعية بشراكم لتحفيظ القرآن بمنطقة الجوف</footer>
<script src="app.js"></script><script>
document.addEventListener("DOMContentLoaded",function(){var e=document.getElementById("studentSelect");if(e)e.innerHTML='<option value="">اختر الطالب</option>'+db.students.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');});
function studentLogin(){var id=document.getElementById("studentSelect").value;if(!id)return alert("اختر الطالب أولًا");var s=db.students.find(x=>x.id===id);if(!s)return;var tr=db.tracking.filter(x=>x.studentId===id).slice().reverse();var ts=db.tests.filter(x=>x.studentId===id).slice().reverse();
panel().innerHTML=head("👨‍🎓 "+s.name,ringName(s.ringId))+'<div class="student-summary"><h3>📚 المقرر وسجل الحفظ</h3>'+(tr.length?tr.map(r=>'<article class="record"><strong>'+esc(r.type||"متابعة")+' — '+esc(r.surah)+'</strong><p>من آية '+esc(r.from)+' إلى '+esc(r.to)+'</p><small>'+esc(r.date)+' • '+esc(r.grade)+'</small></article>').join(''):'<p>لا يوجد مقرر أو سجل حفظ مسجل حتى الآن.</p>')+'<h3>⭐ التقييمات</h3>'+(ts.length?ts.map(t=>'<article class="record"><strong>'+esc(t.name||"تقييم")+'</strong><p>الحفظ: '+Number(t.memorization||0)+'/100 — التجويد: '+Number(t.tajweed||0)+'/100</p><small>'+esc(t.date)+' • الأخطاء: '+Number(t.errors||0)+'</small></article>').join(''):'<p>لا توجد تقييمات مسجلة حتى الآن.</p>')+'</div>';}
</script></body></html>
