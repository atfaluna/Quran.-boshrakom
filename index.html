<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5132">
<title>جمعية بشراكم لتحفيظ القرآن</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">۞</div>
    <div><h1>جمعية بشراكم لتحفيظ القرآن</h1><p>نظام متابعة الطلاب والحلقات</p></div>
  </div>
  <button class="profile" onclick="showTeacher()">حساب المعلم</button>
</header>

<main>
<section class="hero">
  <div><small>لوحة التحكم</small><h2>متابعة الحفظ والمراجعة بسهولة</h2>
  <p>واجهة أولية متوافقة مع الجوال لإدارة الحلقة وتسجيل متابعة الطلاب.</p></div>
</section>

<section class="stats">
 <article><strong id="studentsCount">0</strong><span>الطلاب</span></article>
 <article><strong id="ringsCount">0</strong><span>الحلقات</span></article>
 <article><strong id="teachersCount">0</strong><span>المعلمون</span></article>
 <article><strong>—</strong><span>حضور اليوم</span></article>
</section>

<h2 class="section-title">الخدمات</h2>
<section class="grid">
 <button onclick="openPanel('students')"><i>👥</i><b>الطلاب</b><span>إضافة ومتابعة الطلاب</span></button>
 <button onclick="openPanel('rings')"><i>🕌</i><b>الحلقات</b><span>إدارة حلقات التحفيظ</span></button>
 <button onclick="openPanel('teachers')"><i>👨‍🏫</i><b>المعلمون</b><span>حسابات وصلاحيات المعلمين</span></button>
 <button onclick="openPanel('attendance')"><i>✅</i><b>الحضور</b><span>الحضور والغياب اليومي</span></button>
 <button onclick="openPanel('tracking')"><i>📚</i><b>الحفظ والمراجعة</b><span>تسجيل الورد والتقييم</span></button>
 <button class="quran-card" onclick="openPanel('quran')"><i>📖</i><b>مصحف المعلم</b><span>مصحف داخل حساب كل معلم</span></button>
 <button onclick="openPanel('tests')"><i>⭐</i><b>الاختبارات والتقييم</b><span>الحفظ والتجويد والأخطاء</span></button>
 <button onclick="openPanel('reports')"><i>📊</i><b>التقارير</b><span>تقارير الإنجاز والإحصائيات</span></button>
</section>

<section id="panel" class="panel hidden"></section>
</main>

<footer>جمعية بشراكم لتحفيظ القرآن • النسخة الأولية</footer>
<script src="app.js"></script>
</body></html>
